<!doctype html>
<html>
<head><meta charset="utf-8"><title>History / X</title><script src="/__fixture/shared.js"></script></head>
<body style="margin:0">
  <nav><a data-testid="AppTabBar_Profile_Link" href="/fixtureuser">Profile</a></nav>
  <main data-testid="primaryColumn">
    <div role="tablist">
      <a href="/i/history/likes" role="tab" aria-selected="true">Likes</a>
      <a href="/i/history/bookmarks" role="tab" aria-selected="false">Bookmarks</a>
    </div>
    <div style="height:6000px"></div>
  </main>
  <script>
    // X moves /i/bookmarks under /i/history client-side and opens another
    // history tab; /i/history/bookmarks opens the bookmarks.
    if (location.pathname === "/i/bookmarks") history.replaceState(null, "", "/i/history");
    else if (location.pathname === "/i/history/bookmarks") graphql("Bookmarks", {}, false);
  </script>
</body>
</html>
